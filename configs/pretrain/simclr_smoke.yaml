extends: defaults.yaml
seed: 42
device: auto
manifest: data/processed/manifests/pretrain_smoke.csv
cache_path: data/processed/cache/smoke_gray_128.npy
output_dir: outputs/smoke/simclr-resnet18-gpu-cache
method: simclr
encoder: resnet18
image_size: 128
batch_size: 8
num_workers: 2
prefetch_factor: 2
cache_workers: 4
torch_num_threads: 2
channels_last: true
cudnn_benchmark: true
allow_tf32: true
deterministic: false
fused_optimizer: true
epochs: 1
learning_rate: 0.0003
weight_decay: 0.0001
resume: false
ssl:
  hidden_dim: 128
  projection_dim: 64
augmentation:
  scale: [0.6, 1.0]
  ratio: [0.85, 1.18]
  rotation: 10.0
  translation: 0.05
  brightness: 0.1
  contrast: 0.2
  blur_probability: 0.5
  blur_sigma: [0.1, 1.5]
  noise_probability: 0.5
  noise_std: 0.02
  horizontal_flip: false
